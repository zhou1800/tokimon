[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tokimon"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES", "licenses/*.txt"]

[tool.setuptools.packages.find]
include = ["tokimon*"]

[tool.setuptools.package-data]
tokimon = [
  "settings.example.json",
  "ai_harness_interface/templates/*",
  "tools/mcp/container_executor/Dockerfile",
  "tools/mcp/remote_browser_broker/image/*",
]
